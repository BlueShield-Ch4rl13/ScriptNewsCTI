name: Sonda de avisos (temporal)
on:
  push:
    branches: [sonda-fuentes]
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - run: python .github/sonda_avisos.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: trozos 0
        run: python3 -c "b=open('/tmp/sonda.b64').read(); [print(f'::notice title=t{i:03d}::'+b[i*4000:(i+1)*4000]) for i in range(0,9) if b[i*4000:(i+1)*4000]]"
      - name: trozos 1
        run: python3 -c "b=open('/tmp/sonda.b64').read(); [print(f'::notice title=t{i:03d}::'+b[i*4000:(i+1)*4000]) for i in range(9,18) if b[i*4000:(i+1)*4000]]"
      - name: trozos 2
        run: python3 -c "b=open('/tmp/sonda.b64').read(); [print(f'::notice title=t{i:03d}::'+b[i*4000:(i+1)*4000]) for i in range(18,27) if b[i*4000:(i+1)*4000]]"
      - name: trozos 3
        run: python3 -c "b=open('/tmp/sonda.b64').read(); [print(f'::notice title=t{i:03d}::'+b[i*4000:(i+1)*4000]) for i in range(27,36) if b[i*4000:(i+1)*4000]]"
      - name: trozos 4
        run: python3 -c "b=open('/tmp/sonda.b64').read(); [print(f'::notice title=t{i:03d}::'+b[i*4000:(i+1)*4000]) for i in range(36,45) if b[i*4000:(i+1)*4000]]"
      - name: trozos 5
        run: python3 -c "b=open('/tmp/sonda.b64').read(); [print(f'::notice title=t{i:03d}::'+b[i*4000:(i+1)*4000]) for i in range(45,54) if b[i*4000:(i+1)*4000]]"
