name: CTI Update

on:
  schedule:
    - cron: "0 */3 * * *"   # cada 3 horas (UTC): los avisos de los fabricantes y CERT salen a lo largo del día
  workflow_dispatch:          # permite lanzarlo a mano

# Por defecto, solo lectura. Solo el job que publica puede escribir.
permissions:
  contents: read

# Nunca dos ejecuciones a la vez: evita carreras al hacer push
concurrency:
  group: cti-update
  cancel-in-progress: false

jobs:
  # Ejecuta el pipeline con las API keys pero SIN credenciales de escritura:
  # el único token de GitHub en el runner es el de este job, de solo lectura
  # (para la API de avisos de seguridad), así que un paquete comprometido no
  # puede empujar al repo.
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Acciones fijadas por SHA (la etiqueta se puede mover; el SHA no)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # requirements.txt lleva el hash de cada paquete (pip-compile --generate-hashes)
      - name: Instalar dependencias
        run: pip install --require-hashes -r requirements.txt

      # El estado (caché de VirusTotal/AbuseIPDB y primeras apariciones) vive en
      # la caché de Actions, no en el repositorio: subirlo en cada ejecución
      # hacía crecer el repo unos 100 MB al año.
      - name: Restaurar el estado
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: data/ioc_state.json
          key: cti-estado-${{ github.run_id }}
          restore-keys: cti-estado-

      - name: Ejecutar pipeline CTI
        env:
          ABUSECH_API_KEY: ${{ secrets.ABUSECH_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          # Opcional: con clave, NVD deja 50 peticiones cada 30 s en vez de 5
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # 8 ejecuciones al día: 120 IPs x 8 = 960, dentro de los 1.000 checks/día
          # gratuitos de AbuseIPDB (VirusTotal: 40 x 8 = 320 de 500)
          ABUSEIPDB_BUDGET: "120"
          # Opcional: alertas de lo nuevo y grave a un webhook (n8n -> Telegram).
          # Sin N8N_WEBHOOK_URL no se envía nada.
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          # Opcional (variable, no secreto): productos que vigilar, separados por comas
          CTI_VIGILAR: ${{ vars.CTI_VIGILAR }}
          # Solo lectura (permissions: contents: read): 5000 consultas/h a la
          # GitHub Advisory Database en vez de 60
          GITHUB_TOKEN: ${{ github.token }}
        run: python main.py

      - name: Pruebas
        run: |
          pip install pytest==9.1.1
          python -m pytest -q tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: publicacion
          retention-days: 1
          path: |
            data/iocs_latest.json
            data/iocs_latest.csv
            data/vulns_latest.json
            data/avisos_latest.json
            data/avisos.xml
            data/historico.json
            data/misp/
            README.md

  # Solo copia los ficheros generados y hace commit: no ejecuta código del repo.
  publicar:
    needs: generar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # El feed de MISP se sustituye entero por el generado: así los eventos de
      # más de 7 días que borró el pipeline también desaparecen del repositorio
      - name: Vaciar el feed de MISP anterior
        run: rm -rf data/misp

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: publicacion
          path: .

      - name: Commit y push de cambios
        run: |
          git config user.name "cti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/iocs_latest.json data/iocs_latest.csv data/vulns_latest.json data/avisos_latest.json \
                  data/avisos.xml data/historico.json README.md
          # -A: los eventos de MISP de hace más de 7 días se borran
          git add -A data/misp
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar"
            exit 0
          fi
          git commit -m "CTI update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # El remoto puede haber avanzado durante la ejecución (p. ej. una
          # subida manual de ficheros): se rebasa encima antes de publicar.
          # Si un fichero generado entra en conflicto, gana la versión recién
          # generada (en un rebase, -X theirs = los commits que se reaplican).
          git pull --rebase -X theirs origin main
          git push
