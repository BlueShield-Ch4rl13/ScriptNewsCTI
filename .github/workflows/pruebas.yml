name: Pruebas

# Las pruebas ya corren dentro de "CTI Update" cada 3 horas, pero eso es
# después de publicar. Este workflow las pasa en cada PR y en cada push de
# código, para que un cambio roto no llegue a main. Los commits del bot (solo
# data/ y README.md) no lo disparan.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --require-hashes -r requirements.txt
          pip install pytest==9.1.1 ruff

      - name: Ruff (errores de Python)
        run: ruff check --select F --exclude data .

      # Sin claves de API: las pruebas no salen a la red
      - name: Pytest
        run: python -m pytest -q tests
